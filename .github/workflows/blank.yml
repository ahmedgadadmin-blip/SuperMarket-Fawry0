name: Build SuperMarket Fawry APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q SuperMarket_Fawry_Full_Project.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/SuperMarket_Fawry_Full
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarket-Fawry-APK
          path: extracted/SuperMarket_Fawry_Full/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
